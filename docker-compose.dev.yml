# Переопределение только для локальной разработки на Windows.
# Публикует PostgreSQL исключительно на loopback-интерфейсе.
#
# Пример запуска только базы:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
